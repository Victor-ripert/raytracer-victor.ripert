#
# plugin_dir is the root folder; .so files live in <plugin_dir>/primitives and <plugin_dir>/materials.
#
# This file touches:
#   • plugin_dir
#   • camera: resolution, position, fieldOfView, rotation ({x,y,z} degrees)
#   • primitives:
#       - sphere  with center + r               (alternate keys vs position/radius)
#       - spheres with materials mirror | silver | rock | tinted_mirror
#       - sphere  with color only → built-in Default diffuse (SceneBuilder fallback)
#       - plane   with position + normal       (alternate to point + normal)
#       - plane   with point + normal          (backdrop for reflections/shadow read)
#   • lights:
#       - point       (needs position group)
#       - directional (needs direction vector; need not be unit length)
#

plugin_dir = "plugins";

camera:
{
    resolution = { width = 1000; height = 560; };
    position = { x = 0.0; y = 0.35; z = 0.0; };
    fieldOfView = 102.0;
    rotation = { x = 0.0; y = 0.0; z = 0.0; };
};

# Sphere radius 0.34 resting on plane y = -0.55  → center y = -0.21
primitives = (
    # --- Default diffuse (SceneBuilder attaches Default IMaterial when no plugin material) ---
    {
        type = "sphere";
        center = { x = -1.56; y = -0.21; z = -2.5; };
        r = 0.34;
        color = { r = 200; g = 80; b = 80; };
    },
    # --- Plugin materials (left → right): mirror → silver → rock → tinted_mirror ---
    {
        type = "sphere";
        position = { x = -0.78; y = -0.21; z = -2.5; };
        radius = 0.34;
        color = { r = 220; g = 220; b = 220; };
        material = { type = "mirror"; };
    },
    {
        type = "sphere";
        position = { x = 0.0; y = -0.21; z = -2.5; };
        radius = 0.34;
        color = { r = 180; g = 190; b = 200; };
        material = { type = "silver"; };
    },
    {
        type = "sphere";
        position = { x = 0.78; y = -0.21; z = -2.5; };
        radius = 0.34;
        color = { r = 110; g = 95; b = 85; };
        material = { type = "rock"; };
    },
    {
        type = "sphere";
        position = { x = 1.56; y = -0.21; z = -2.5; };
        radius = 0.34;
        color = { r = 70; g = 48; b = 120; };
        material = { type = "tinted_mirror"; };
    },
    # --- Floor: plane primitive using "position" alias (same as point) ---
    {
        type = "plane";
        position = { x = 0.0; y = -0.55; z = 0.0; };
        normal = { x = 0.0; y = 1.0; z = 0.0; };
        color = { r = 150; g = 155; b = 160; };
    },
    # --- Back wall: sharp background + something for mirrors to reflect ---
    {
        type = "plane";
        point = { x = 0.0; y = 0.0; z = -6.2; };
        normal = { x = 0.0; y = 0.0; z = 1.0; };
        color = { r = 52; g = 58; b = 72; };
    }
);

lights = (
    {
        type = "point";
        position = { x = 1.8; y = 2.4; z = 1.2; };
    },
    {
        type = "point";
        position = { x = -1.8; y = 2.2; z = 0.8; };
    },
    {
        type = "point";
        position = { x = 0.0; y = 2.8; z = 1.5; };
    },
    {
        type = "directional";
        direction = { x = 0.25; y = 1.0; z = 0.2; };
    }
);
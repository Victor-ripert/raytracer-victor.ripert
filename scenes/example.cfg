# Scene for G-OOP-400-BAR raytracer — run from repo root: ./raytracer scenes/example.cfg
# Plugin .so files are expected under ./plugins (override with top-level plugin_dir).

plugin_dir = "plugins";

camera:
{
    resolution = { width = 800; height = 600; };
    position = { x = 0.0; y = 0.0; z = 0.0; };
};

primitives = (
    {
        type = "sphere";
        position = { x = 0.0; y = 0.0; z = -1.0; };
        radius = 0.45;
        color = { r = 255; g = 0; b = 0; };
    },
    {
        type = "plane";
        point = { x = 0.0; y = -0.55; z = 0.0; };
        normal = { x = 0.0; y = 1.0; z = 0.0; };
        color = { r = 120; g = 120; b = 120; };
    }
);

lights = (
    {
        type = "point";
        position = { x = 2.0; y = 2.0; z = 1.0; };
    }
);

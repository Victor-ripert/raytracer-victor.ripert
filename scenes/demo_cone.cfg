        height = -2.0; // Opens downwards to y=-1
        color = { r = 50; g = 50; b = 255; };
    },
    {
        type = "plane";
        point = { x = 0.0; y = -1.0; z = 0.0; };
        normal = { x = 0.0; y = 1.0; z = 0.0; };
        color = { r = 100; g = 100; b = 100; };
    }
);

lights = (
    {
        type = "point";
        position = { x = 3.0; y = 3.0; z = 3.0; };
    }
);

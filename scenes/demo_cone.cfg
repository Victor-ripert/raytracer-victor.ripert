plugin_dir = "plugins";

camera:
{
    resolution = { width = 800; height = 600; };
    position = { x = 0.0; y = 2.0; z = 5.0; };
    fieldOfView = 90.0;
    rotation = { x = -20.0; y = 0.0; z = 0.0; };
};

